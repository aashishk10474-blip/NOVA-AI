<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA AI — Profile</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#05050b;
  --card:#0b0b14;
  --card2:#10101c;
  --line:rgba(255,255,255,.09);
  --text:#fff;
  --muted:#858596;
  --purple:#8b5cf6;
  --pink:#ec4899;
}

body{
  min-height:100vh;
  padding:20px;

  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 15%,
      #8b5cf625,
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 80%,
      #ec489920,
      transparent 30%
    ),
    var(--bg);
}

/* BACKGROUND */

.background{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.grid{
  position:absolute;
  inset:0;

  opacity:.10;

  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);

  background-size:60px 60px;

  mask-image:
    linear-gradient(
      to bottom,
      #000,
      transparent
    );
}

/* PAGE */

.page{
  width:min(900px,100%);
  margin:0 auto;

  animation:appear .6s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* TOP */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:18px;
}

.back{
  color:#777788;
  text-decoration:none;
  font-size:11px;
}

.back:hover{
  color:white;
}

.logo{
  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#a78bfa;
}

/* HERO */

.hero{
  position:relative;

  padding:35px;

  display:flex;
  align-items:center;
  gap:30px;

  border:1px solid var(--line);
  border-radius:28px;

  background:
    linear-gradient(
      135deg,
      #8b5cf612,
      #ffffff03
    );

  box-shadow:
    0 25px 80px #0008;

  overflow:hidden;
}

.hero::after{
  content:"";

  position:absolute;

  width:260px;
  height:260px;

  right:-100px;
  top:-130px;

  border-radius:50%;

  background:#8b5cf630;

  filter:blur(70px);
}

/* AVATAR */

.avatar{
  width:125px;
  height:125px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  border:2px solid #9b7cff66;

  background:
    radial-gradient(
      circle,
      #8b5cf630,
      #10101c
    );

  box-shadow:
    0 0 35px #8b5cf644;

  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* FALLBACK AVATAR */

.avatar-text{
  font-size:42px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #a78bfa,
      #ec4899
    );

  -webkit-background-clip:text;
  color:transparent;
}

.hero-info{
  position:relative;
  z-index:2;
}

.badge{
  display:inline-block;

  padding:5px 9px;

  margin-bottom:9px;

  border:1px solid #8b5cf633;
  border-radius:20px;

  background:#8b5cf612;

  color:#a78bfa;

  font-size:8px;
  font-weight:bold;

  letter-spacing:1px;
}

.hero h1{
  font-size:29px;

  word-break:break-word;
}

.email{
  margin-top:7px;

  color:var(--muted);

  font-size:11px;

  word-break:break-all;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;

  margin-top:12px;

  color:#777788;

  font-size:9px;
}

.dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:#4ade80;

  box-shadow:
    0 0 10px #4ade80;
}

/* CONTENT */

.content{
  margin-top:18px;

  display:grid;
  grid-template-columns:1fr 1fr;

  gap:18px;
}

/* CARD */

.card{
  padding:23px;

  border:1px solid var(--line);
  border-radius:23px;

  background:#090912dd;

  box-shadow:
    0 18px 55px #0006;
}

.card-title{
  margin-bottom:18px;

  color:#777788;

  font-size:9px;
  font-weight:bold;

  letter-spacing:1.5px;
}

/* INFO ROW */

.info{
  display:flex;
  align-items:center;

  gap:13px;

  padding:13px 0;

  border-bottom:1px solid #ffffff08;
}

.info:last-child{
  border-bottom:0;
}

.icon{
  width:38px;
  height:38px;

  flex-shrink:0;

  display:grid;
  place-items:center;

  border-radius:11px;

  background:#8b5cf612;

  font-size:16px;
}

.info-label{
  color:#67677a;
  font-size:8px;

  margin-bottom:4px;
}

.info-value{
  color:#eee;

  font-size:11px;

  word-break:break-all;
}

/* ACTIONS */

.action{
  width:100%;

  display:flex;
  align-items:center;
  gap:13px;

  padding:14px;

  margin-bottom:9px;

  border:1px solid #ffffff09;
  border-radius:14px;

  background:#ffffff03;

  color:white;

  cursor:pointer;

  text-align:left;

  transition:.2s;
}

.action:last-child{
  margin-bottom:0;
}

.action:hover{
  border-color:#8b5cf633;
  background:#8b5cf609;

  transform:translateX(2px);
}

.action-icon{
  width:35px;
  height:35px;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:#ffffff06;

  font-size:15px;
}

.action-text{
  flex:1;
}

.action-name{
  font-size:10px;
  font-weight:bold;
}

.action-desc{
  margin-top:3px;

  color:#646477;

  font-size:8px;
}

.arrow{
  color:#67677a;
}

/* LOGOUT */

.logout{
  width:100%;

  margin-top:18px;

  padding:15px;

  border:1px solid #fb718522;
  border-radius:15px;

  background:#fb71850a;

  color:#fb7185;

  font-size:11px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.logout:hover{
  background:#fb718514;
}

/* FOOTER */

.footer{
  margin-top:18px;

  text-align:center;

  color:#444456;

  font-size:8px;
}

/* MOBILE */

@media(max-width:650px){

  body{
    padding:14px;
  }

  .hero{
    padding:25px 20px;

    flex-direction:column;

    text-align:center;
  }

  .hero h1{
    font-size:25px;
  }

  .status{
    justify-content:center;
  }

  .content{
    grid-template-columns:1fr;
  }

  .top{
    margin-bottom:14px;
  }

}

@media(max-width:380px){

  .avatar{
    width:105px;
    height:105px;
  }

  .hero{
    border-radius:23px;
  }

  .card{
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="grid"></div>
</div>


<div class="page">

  <!-- TOP -->

  <div class="top">

    <a
      href="chat.html"
      class="back">

      ← Back to Chat

    </a>

    <div class="logo">
      NOVA <span>AI</span>
    </div>

  </div>


  <!-- PROFILE HERO -->

  <section class="hero">

    <div class="avatar">

      <img
        id="profileCharacter"
        src="character.png"
        alt="Profile">

    </div>


    <div class="hero-info">

      <div class="badge">
        NOVA AI MEMBER
      </div>

      <h1 id="profileName">
        NOVA User
      </h1>

      <div
        class="email"
        id="profileEmail">

        user@example.com

      </div>

      <div class="status">

        <span class="dot"></span>

        Account active

      </div>

    </div>

  </section>


  <!-- CONTENT -->

  <div class="content">


    <!-- ACCOUNT -->

    <section class="card">

      <div class="card-title">
        ACCOUNT INFORMATION
      </div>


      <div class="info">

        <div class="icon">
          👤
        </div>

        <div>

          <div class="info-label">
            NAME
          </div>

          <div
            class="info-value"
            id="infoName">

            —

          </div>

        </div>

      </div>


      <div class="info">

        <div class="icon">
          @
        </div>

        <div>

          <div class="info-label">
            EMAIL
          </div>

          <div
            class="info-value"
            id="infoEmail">

            —

          </div>

        </div>

      </div>


      <div class="info">

        <div class="icon">
          ✨
        </div>

        <div>

          <div class="info-label">
            PLAN
          </div>

          <div class="info-value">
            NOVA Free
          </div>

        </div>

      </div>

    </section>


    <!-- QUICK ACTIONS -->

    <section class="card">

      <div class="card-title">
        QUICK ACTIONS
      </div>


      <button
        class="action"
        onclick="openChat()">

        <div class="action-icon">
          💬
        </div>

        <div class="action-text">

          <div class="action-name">
            Open AI Chat
          </div>

          <div class="action-desc">
            Continue chatting with NOVA
          </div>

        </div>

        <div class="arrow">
          →
        </div>

      </button>


      <button
        class="action"
        onclick="openSettings()">

        <div class="action-icon">
          ⚙️
        </div>

        <div class="action-text">

          <div class="action-name">
            Settings
          </div>

          <div class="action-desc">
            Customize your experience
          </div>

        </div>

        <div class="arrow">
          →
        </div>

      </button>


      <button
        class="action"
        onclick="editName()">

        <div class="action-icon">
          ✏️
        </div>

        <div class="action-text">

          <div class="action-name">
            Edit Name
          </div>

          <div class="action-desc">
            Change your display name
          </div>

        </div>

        <div class="arrow">
          →
        </div>

      </button>

    </section>

  </div>


  <!-- LOGOUT -->

  <button
    class="logout"
    onclick="logout()">

    🚪 &nbsp; Log out of NOVA AI

  </button>


  <div class="footer">
    NOVA AI • Your personal AI workspace
  </div>

</div>


<script>

/* =========================
   LOAD PROFILE
========================= */

const savedName =
  localStorage.getItem(
    "novaName"
  );

const savedEmail =
  localStorage.getItem(
    "novaEmail"
  );


/* NAME */

if(savedName){

  document.getElementById(
    "profileName"
  ).textContent = savedName;

  document.getElementById(
    "infoName"
  ).textContent = savedName;

}


/* EMAIL */

if(savedEmail){

  document.getElementById(
    "profileEmail"
  ).textContent = savedEmail;

  document.getElementById(
    "infoEmail"
  ).textContent = savedEmail;

}


/* =========================
   NAVIGATION
========================= */

function openChat(){

  window.location.href =
    "chat.html";

}


function openSettings(){

  window.location.href =
    "settings.html";

}


/* =========================
   EDIT NAME
========================= */

function editName(){

  const oldName =
    localStorage.getItem(
      "novaName"
    ) || "";


  const newName =
    prompt(
      "Enter your new name:",
      oldName
    );


  if(
    newName === null
  ){
    return;
  }


  const name =
    newName.trim();


  if(!name){

    alert(
      "Name cannot be empty."
    );

    return;
  }


  localStorage.setItem(
    "novaName",
    name
  );


  document.getElementById(
    "profileName"
  ).textContent = name;


  document.getElementById(
    "infoName"
  ).textContent = name;

}


/* =========================
   LOGOUT
========================= */

function logout(){

  const confirmLogout =
    confirm(
      "Are you sure you want to log out?"
    );


  if(!confirmLogout){
    return;
  }


  localStorage.removeItem(
    "novaLoggedIn"
  );


  window.location.href =
    "login.html";

}

</script>

</body>
</html>
