<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI - Ideas</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: #07070f;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .header {
      margin-bottom: 25px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .logo span {
      color: #a855f7;
    }

    .subtitle {
      color: #999;
      margin-top: 6px;
    }

    .card {
      background: #10101b;
      border: 1px solid #29213f;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    .card h2 {
      margin-bottom: 10px;
    }

    .card p {
      color: #aaa;
      line-height: 1.6;
    }

    .ideas {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .idea {
      background: #151221;
      border: 1px solid #30244b;
      border-radius: 15px;
      padding: 20px;
      cursor: pointer;
      transition: .2s;
    }

    .idea:hover {
      transform: translateY(-3px);
      border-color: #9b5cff;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .idea p {
      margin-top: 6px;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      margin-top: 15px;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #30244b;
      background: #080812;
      color: white;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #9b5cff;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 13px;
      background: #9b5cff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 18px;
      white-space: pre-wrap;
      color: #ddd;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="logo">NOVA <span>AI</span></div>
      <div class="subtitle">Ideas & Creativity</div>
    </div>

    <div class="card">
      <h2>💡 NOVA Ideas</h2>

      <p>
        कोई नया idea चाहिए? नीचे से category चुनो।
      </p>

      <div class="ideas">

        <div class="idea" onclick="setIdea('एक नई mobile app का idea दो')">
          <div class="icon">📱</div>
          <b>App Ideas</b>
          <p>नई app के ideas</p>
        </div>

        <div class="idea" onclick="setIdea('एक नए website project का idea दो')">
          <div class="icon">🌐</div>
          <b>Website</b>
          <p>Website project ideas</p>
        </div>

        <div class="idea" onclick="setIdea('एक AI project का अच्छा idea दो')">
          <div class="icon">🤖</div>
          <b>AI Projects</b>
          <p>AI project ideas</p>
        </div>

        <div class="idea" onclick="setIdea('एक YouTube channel के लिए नए ideas दो')">
          <div class="icon">🎥</div>
          <b>YouTube</b>
          <p>Content ideas</p>
        </div>

        <div class="idea" onclick="setIdea('एक school student के लिए useful project idea दो')">
          <div class="icon">🎓</div>
          <b>Student</b>
          <p>Student projects</p>
        </div>

        <div class="idea" onclick="setIdea('एक simple game बनाने का idea दो')">
          <div class="icon">🎮</div>
          <b>Games</b>
          <p>Game ideas</p>
        </div>

      </div>
    </div>

    <div class="card">

      <h2>✨ अपना idea पूछो</h2>

      <textarea
        id="question"
        placeholder="जैसे: मेरे लिए एक unique AI app का idea दो..."
      ></textarea>

      <button onclick="askAI()">Generate Ideas</button>

      <div id="result"></div>

    </div>

  </div>

  <script>

    function setIdea(text) {
      document.getElementById("question").value = text;
      document.getElementById("question").focus();
    }

    async function askAI() {

      const question =
        document.getElementById("question").value.trim();

      const result =
        document.getElementById("result");

      if (!question) {
        result.textContent =
          "⚠️ पहले अपना idea लिखो।";
        return;
      }

      result.textContent =
        "⏳ NOVA AI ideas तैयार कर रहा है...";

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: question
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed"
          );
        }

        result.textContent =
          data.reply ||
          data.message ||
          data.text ||
          "⚠️ कोई जवाब नहीं मिला।";

      } catch (error) {

        result.textContent =
          "⚠️ Error: " + error.message;

      }

    }

  </script>

</body>
</html>
