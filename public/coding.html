<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NOVA AI — Coding</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 10%,#8b5cf618,transparent 30%),
    radial-gradient(circle at 90% 90%,#ec489914,transparent 30%),
    #05050b;
  padding:20px;
}

.container{
  width:min(950px,100%);
  margin:auto;
}

.header{
  padding:15px 5px 25px;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.logo span{
  color:#a78bfa;
}

.subtitle{
  margin-top:6px;
  color:#777789;
  font-size:11px;
}

.card{
  margin-bottom:18px;
  padding:20px;
  border:1px solid #ffffff0e;
  border-radius:18px;
  background:#0b0b14e8;
  box-shadow:0 15px 50px #0007;
}

.card h2{
  margin-bottom:8px;
  font-size:18px;
}

.card p{
  color:#888899;
  font-size:11px;
  line-height:1.6;
}

.languages{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;
  margin-top:18px;
}

.language{
  padding:16px;
  border:1px solid #ffffff0d;
  border-radius:13px;
  background:#ffffff04;
  color:#ddd;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.language:hover{
  border-color:#8b5cf655;
  background:#8b5cf609;
  transform:translateY(-2px);
}

.icon{
  margin-bottom:7px;
  font-size:25px;
}

textarea{
  width:100%;
  min-height:150px;
  margin-top:15px;
  padding:15px;
  border:1px solid #ffffff12;
  border-radius:14px;
  outline:none;
  resize:vertical;
  background:#05050b;
  color:#fff;
  font-family:monospace;
  font-size:13px;
  line-height:1.6;
}

textarea:focus{
  border-color:#8b5cf655;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:13px;
  background:linear-gradient(135deg,#7c3aed,#ec4899);
  color:#fff;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#result{
  margin-top:18px;
  padding:15px;
  border:1px solid #ffffff09;
  border-radius:14px;
  background:#05050b;
  color:#ddd;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:12px;
  line-height:1.6;
  display:none;
}

@media(max-width:600px){
  body{
    padding:12px;
  }

  .logo{
    font-size:24px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">
      NOVA <span>AI</span>
    </div>

    <div class="subtitle">
      Coding Assistant
    </div>
  </div>


  <div class="card">

    <h2>💻 NOVA Coding</h2>

    <p>
      Code लिखो, error समझो या किसी programming concept को आसान भाषा में समझो।
    </p>


    <div class="languages">

      <div
        class="language"
        onclick="setPrompt('JavaScript में एक simple project बनाना है')">

        <div class="icon">🟨</div>
        JavaScript

      </div>


      <div
        class="language"
        onclick="setPrompt('HTML और CSS से एक modern website बनानी है')">

        <div class="icon">🌐</div>
        HTML / CSS

      </div>


      <div
        class="language"
        onclick="setPrompt('Python programming मुझे आसान भाषा में समझाओ')">

        <div class="icon">🐍</div>
        Python

      </div>


      <div
        class="language"
        onclick="setPrompt('Java programming का एक simple example दो')">

        <div class="icon">☕</div>
        Java

      </div>


      <div
        class="language"
        onclick="setPrompt('Node.js में server बनाना समझाओ')">

        <div class="icon">🟢</div>
        Node.js

      </div>


      <div
        class="language"
        onclick="setPrompt('मेरे code की error समझाने में मदद करो')">

        <div class="icon">🐞</div>
        Debug

      </div>

    </div>

  </div>


  <div class="card">

    <h2>🧑‍💻 अपना coding सवाल पूछो</h2>

    <textarea
      id="question"
      placeholder="जैसे: JavaScript में button click करने पर text कैसे बदलें?"></textarea>


    <button
      id="askButton"
      onclick="askAI()">

      Generate Code

    </button>


    <div id="result"></div>

  </div>

</div>


<script>

function setPrompt(text){

  const question =
    document.getElementById("question");

  question.value = text;

  question.focus();

}


async function askAI(){

  const question =
    document.getElementById("question")
    .value
    .trim();

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("askButton");


  if(!question){

    result.style.display = "block";

    result.textContent =
      "⚠️ पहले अपना coding सवाल लिखो।";

    return;

  }


  button.disabled = true;

  button.textContent =
    "⏳ Code तैयार हो रहा है...";


  result.style.display = "block";

  result.textContent =
    "NOVA AI सोच रहा है...";


  try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          message:
            "You are a coding assistant. " +
            "Explain the solution clearly and " +
            "provide working code when appropriate. " +
            "User question: " +
            question

        })

      });


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){

      data = {};

    }


    if(!response.ok){

      throw new Error(
        data.error ||
        data.message ||
        `HTTP Error ${response.status}`
      );

    }


    result.textContent =
      data.reply ||
      data.message ||
      data.text ||
      "⚠️ कोई जवाब नहीं मिला।";


  }catch(error){

    result.textContent =
      "⚠️ Error: " +
      error.message;

  }


  button.disabled = false;

  button.textContent =
    "Generate Code";

}


document
  .getElementById("question")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter" &&
        (event.ctrlKey || event.metaKey)
      ){

        askAI();

      }

    }
  );

</script>

</body>
</html>
