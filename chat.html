<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NOVA AI — Chat</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#05050b;
  --panel:#090912;
  --line:#ffffff0e;
  --text:#fff;
  --muted:#777789;
  --purple:#8b5cf6;
  --pink:#ec4899;
}

html,body{
  width:100%;
  height:100%;
}

body{
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      #8b5cf618,
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 90%,
      #ec489914,
      transparent 30%
    ),
    var(--bg);
}

/* BACKGROUND */

.bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
}

.grid{
  position:absolute;
  inset:0;
  opacity:.08;

  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);

  background-size:60px 60px;
}

/* APP */

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:245px;
  height:100%;

  padding:15px;

  display:flex;
  flex-direction:column;

  border-right:1px solid var(--line);

  background:#070710e8;

  backdrop-filter:blur(25px);

  flex-shrink:0;

  transition:.25s;
}

/* BACK BUTTON */

.side-back{
  display:block !important;

  width:100%;
  height:42px;

  margin:0 0 15px 0;

  border:1px solid #ffffff20;
  border-radius:10px;

  background:#ffffff08;

  color:#ffffff;

  font-size:12px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.side-back:hover{
  background:#ffffff12;
}

.side-back:active{
  transform:scale(.97);
}

/* LOGO */

.logo{
  padding:5px 10px 25px;

  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#a78bfa;
}

/* NEW CHAT */

.new-chat{
  width:100%;
  height:44px;

  border:1px solid #8b5cf633;
  border-radius:12px;

  background:#8b5cf610;

  color:#ddd;

  font-size:11px;
  font-weight:bold;

  cursor:pointer;

  transition:.2s;
}

.new-chat:hover{
  background:#8b5cf61b;
  border-color:#8b5cf655;
}

/* SIDE TITLE */

.side-title{
  margin:27px 10px 10px;

  color:#555568;

  font-size:8px;
  font-weight:bold;

  letter-spacing:1.5px;
}

/* HISTORY */

.history{
  flex:1;
  overflow-y:auto;
}

.history-item{
  width:100%;

  display:block;

  padding:11px;

  margin-bottom:5px;

  border:1px solid transparent;
  border-radius:10px;

  background:transparent;

  color:#858596;

  font-size:10px;

  text-align:left;

  cursor:pointer;
}

.history-item:hover,
.history-item.active{
  background:#ffffff06;
  border-color:#ffffff08;
  color:white;
}

/* SIDE BOTTOM */

.side-bottom{
  border-top:1px solid var(--line);
  padding-top:12px;
}

.side-btn{
  width:100%;

  display:flex;
  align-items:center;
  gap:10px;

  padding:11px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:#858596;

  text-align:left;

  font-size:10px;

  cursor:pointer;
}

.side-btn:hover{
  background:#ffffff06;
  color:white;
}

/* OVERLAY */

.sidebar-overlay{
  display:none;

  position:fixed;
  inset:0;

  z-index:15;

  background:#0009;
}

/* MAIN */

.main{
  min-width:0;
  flex:1;
  height:100%;

  display:flex;
  flex-direction:column;
}

/* TOPBAR */

.topbar{
  height:65px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  border-bottom:1px solid var(--line);

  background:#07071099;

  backdrop-filter:blur(20px);
}

.mobile-menu{
  display:none;

  border:0;
  background:none;

  color:white;

  font-size:20px;

  cursor:pointer;
}

.ai-name{
  display:flex;
  align-items:center;
  gap:10px;
}

.ai-dot{
  width:9px;
  height:9px;

  border-radius:50%;

  background:#4ade80;

  box-shadow:0 0 12px #4ade80;
}

.ai-name strong{
  font-size:12px;
}

.ai-name small{
  display:block;

  margin-top:3px;

  color:#626276;

  font-size:8px;
}

.top-actions{
  display:flex;
  gap:7px;
}

.top-btn{
  width:34px;
  height:34px;

  border:1px solid #ffffff0b;
  border-radius:10px;

  background:#ffffff04;

  color:#858596;

  cursor:pointer;

  transition:.2s;
}

.top-btn:hover{
  color:white;
  background:#ffffff09;
}

/* CHAT */

.chat{
  flex:1;

  overflow-y:auto;

  padding:35px 20px 25px;

  scroll-behavior:smooth;
}

.chat-inner{
  width:min(850px,100%);
  margin:auto;
}

/* WELCOME */

.welcome{
  min-height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  padding:40px 0 70px;
}

.ai-avatar{
  position:relative;

  width:150px;
  height:150px;

  margin-bottom:25px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.ai-avatar::before{
  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #8b5cf640,
      transparent 68%
    );

  filter:blur(10px);
}

.ai-avatar img{
  position:relative;
  z-index:2;

  width:100%;
  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(0 0 25px #8b5cf655)
    drop-shadow(0 15px 25px #000);
}

.welcome h1{
  font-size:28px;
}

.welcome h1 span{
  background:
    linear-gradient(
      90deg,
      #a78bfa,
      #f472b6
    );

  -webkit-background-clip:text;
  background-clip:text;

  color:transparent;
}

.welcome p{
  max-width:420px;

  margin-top:9px;

  color:#777789;

  font-size:11px;

  line-height:1.6;
}

/* SUGGESTIONS */

.suggestions{
  display:flex;
  flex-wrap:wrap;

  justify-content:center;

  gap:8px;

  margin-top:25px;
}

.suggestion{
  padding:10px 13px;

  border:1px solid #ffffff0d;
  border-radius:12px;

  background:#ffffff04;

  color:#888899;

  font-size:9px;

  cursor:pointer;

  transition:.2s;
}

.suggestion:hover{
  color:white;
  border-color:#8b5cf633;
  background:#8b5cf609;
}

/* MESSAGES */

.message{
  display:flex;

  gap:11px;

  margin-bottom:20px;

  animation:messageIn .25s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.message.user{
  justify-content:flex-end;
}

.msg-avatar{
  width:30px;
  height:30px;

  flex-shrink:0;

  display:grid;
  place-items:center;

  border-radius:10px;

  background:#8b5cf615;

  overflow:hidden;

  font-size:11px;
}

.msg-avatar img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.msg-content{
  max-width:min(650px,80%);
}

.msg-name{
  margin-bottom:5px;

  color:#66667a;

  font-size:8px;
}

.msg-text{
  padding:12px 14px;

  border:1px solid #ffffff09;
  border-radius:14px;

  background:#ffffff04;

  color:#ddd;

  font-size:11px;

  line-height:1.6;

  white-space:pre-wrap;

  overflow-wrap:anywhere;
}

.user .msg-content{
  text-align:right;
}

.user .msg-text{
  display:inline-block;

  background:
    linear-gradient(
      135deg,
      #713cff25,
      #ec489918
    );

  border-color:#8b5cf625;

  text-align:left;
}

/* TYPING */

.typing{
  display:flex;
  gap:4px;

  width:max-content;

  padding:13px 15px;

  border:1px solid #ffffff09;
  border-radius:14px;

  background:#ffffff04;
}

.typing span{
  width:5px;
  height:5px;

  border-radius:50%;

  background:#858596;

  animation:typing 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes typing{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  50%{
    opacity:1;
    transform:translateY(-3px);
  }
}

/* INPUT */

.input-area{
  flex-shrink:0;

  padding:
    10px 20px 20px;

  background:
    linear-gradient(
      to top,
      #05050b 65%,
      transparent
    );
}

.input-box{
  width:min(850px,100%);

  margin:auto;

  display:flex;
  align-items:flex-end;
  gap:8px;

  padding:8px;

  border:1px solid #ffffff12;
  border-radius:18px;

  background:#0b0b14e8;

  box-shadow:
    0 15px 50px #0009;

  backdrop-filter:blur(20px);
}

textarea{
  flex:1;

  min-height:38px;
  max-height:120px;

  padding:10px 8px;

  resize:none;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  font-family:inherit;
  font-size:11px;

  line-height:1.5;
}

textarea::placeholder{
  color:#555568;
}

.send{
  width:39px;
  height:39px;

  flex-shrink:0;

  border:0;
  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #7c3aed,
      #ec4899
    );

  color:white;

  font-size:16px;

  cursor:pointer;

  box-shadow:
    0 7px 20px #8b5cf640;

  transition:.2s;
}

.send:hover{
  transform:translateY(-1px);
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
}

.hint{
  width:min(850px,100%);

  margin:7px auto 0;

  color:#3f3f50;

  font-size:7px;

  text-align:center;
}

/* MOBILE */

@media(max-width:750px){

  .sidebar{
    position:fixed;

    left:0;
    top:0;

    z-index:20;

    transform:translateX(-260px);

    width:245px;

    transition:.25s;

    box-shadow:20px 0 60px #000;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .chat{
    padding:
      25px 13px 15px;
  }

  .input-area{
    padding:
      8px 10px 13px;
  }

  .welcome{
    padding:
      20px 0 60px;
  }

  .ai-avatar{
    width:125px;
    height:125px;
  }

  .welcome h1{
    font-size:24px;
  }

  .welcome p{
    padding:0 15px;
  }

  .msg-content{
    max-width:82%;
  }

}

</style>
</head>

<body>

<div class="bg">
  <div class="grid"></div>
</div>

<div class="app">

<aside
  class="sidebar"
  id="sidebar">

  <div class="logo">
    NOVA <span>AI</span>
  </div>

  <button
    class="new-chat"
    onclick="newChat()">
    ＋ &nbsp; New Chat
  </button>

  <div class="side-title">
    RECENT CHATS
  </div>

  <div
  class="history"
  id="history">
  </div>

  <div class="side-bottom">

    <button
      class="side-btn"
      onclick="openProfile()">
      👤
      <span>Profile</span>
    </button>

    <button
      class="side-btn"
      onclick="openSettings()">
      ⚙️
      <span>Settings</span>
    </button>

    <button
      class="side-btn"
      onclick="logout()">
      🚪
      <span>Log out</span>
    </button>

  </div>

</aside>

<div
  class="sidebar-overlay"
  id="sidebarOverlay"
  onclick="closeSidebar()">
</div>
<main class="main">

<header class="topbar">

  <div class="ai-name">

    <button
      class="mobile-menu"
      type="button"
      onclick="toggleSidebar()">
      ☰
    </button>

    <span class="ai-dot"></span>

    <div>
      <strong>NOVA AI</strong>
      <small>Online & ready</small>
    </div>

  </div>

  <div class="top-actions">

    <button
      class="top-btn"
      type="button"
      title="New Chat"
      onclick="newChat()">
      ＋
    </button>

    <button
      class="top-btn"
      type="button"
      title="Profile"
      onclick="openProfile()">
      👤
    </button>

  </div>

</header>


<section
  class="chat"
  id="chat">

  <div
    class="chat-inner"
    id="chatInner">

    <div
      class="welcome"
      id="welcome">

      <div class="ai-avatar">

        <img
          src="character.png"
          alt="NOVA AI">

      </div>

      <h1>
        Hello,
        <span id="userName">there</span>
        👋
      </h1>

      <p>
        I'm NOVA, your personal AI companion.
        Ask me anything, brainstorm ideas,
        learn something new or build something.
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="useSuggestion('Help me learn something new')">
          ✨ Learn something
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Give me a creative project idea')">
          💡 Creative idea
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Help me write some code')">
          💻 Help with code
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Explain AI in simple words')">
          🤖 Explain AI
        </button>

      </div>

    </div>

  </div>

</section>


<div class="input-area">

  <div class="input-box">

    <textarea
      id="messageInput"
      rows="1"
      placeholder="Message NOVA AI..."
      oninput="resizeInput()"
      onkeydown="handleKey(event)"></textarea>

    <button
      class="send"
      id="sendButton"
      type="button"
      onclick="sendMessage()">
      ↑
    </button>

  </div>

  <div class="hint">
    NOVA AI can make mistakes. Check important information.
  </div>

</div>

</main>

</div>


<script>

/* =========================
   USER
========================= */

const savedName =
  localStorage.getItem("novaName");

if(savedName){

  document.getElementById("userName")
    .textContent = savedName;

}


/* =========================
   ELEMENTS
========================= */

const input =
  document.getElementById("messageInput");

const chatInner =
  document.getElementById("chatInner");

const chat =
  document.getElementById("chat");

const sendButton =
  document.getElementById("sendButton");

const sidebar =
  document.getElementById("sidebar");

const sidebarOverlay =
  document.getElementById("sidebarOverlay");
const historyBox =
  document.getElementById("history");

/* =========================
   CHAT MEMORY + SAVED CHATS
========================= */

let chatHistory = [];
let waitingForAI = false;

let currentChatId = null;

let savedChats = JSON.parse(
  localStorage.getItem("novaSavedChats") || "[]"
);

/* =========================
   SAVE CHATS
========================= */

function saveChats(){
  localStorage.setItem(
    "novaSavedChats",
    JSON.stringify(savedChats)
  );
}

/* =========================
   SAVE CURRENT CHAT
========================= */

function saveCurrentChat(){

  if(!currentChatId){
    currentChatId = Date.now().toString();
  }

  if(!chatHistory.length){
    return;
  }

  const firstUserMessage =
    chatHistory.find(x => x.role === "user");

  const title =
    firstUserMessage
      ? String(firstUserMessage.text).slice(0,35)
      : "New conversation";

  const existingIndex =
    savedChats.findIndex(
      chat => chat.id === currentChatId
    );

  const chatData = {
    id: currentChatId,
    title: title,
    messages: chatHistory,
    updatedAt: Date.now()
  };

  if(existingIndex >= 0){
    savedChats[existingIndex] = chatData;
  }else{
    savedChats.unshift(chatData);
  }

  savedChats.sort(
    (a,b) => b.updatedAt - a.updatedAt
  );

  saveChats();
  renderHistory();
}

/* =========================
   RECENT CHATS
========================= */

function renderHistory(){

  historyBox.innerHTML = "";

  if(!savedChats.length){

    historyBox.innerHTML = `
      <div style="
        padding:12px;
        color:#555568;
        font-size:9px;
        text-align:center;
      ">
        No saved chats yet
      </div>
    `;

    return;
  }

  savedChats.forEach(chat => {

    const item =
      document.createElement("button");

    item.className =
      "history-item" +
      (chat.id === currentChatId
        ? " active"
        : "");

    item.type = "button";

    item.innerHTML =
      `✦ &nbsp; ${escapeHTML(chat.title)}`;

    item.onclick = function(){

      loadChat(chat.id);

    };

    historyBox.appendChild(item);

  });
}

/* =========================
   LOAD SAVED CHAT
========================= */

function loadChat(id){

  const chatData =
    savedChats.find(
      chat => chat.id === id
    );

  if(!chatData){
    return;
  }

  currentChatId = chatData.id;

  chatHistory =
    Array.isArray(chatData.messages)
      ? chatData.messages
      : [];

  chatInner.innerHTML = "";

  chatHistory.forEach(message => {

    if(
      message.role === "user" &&
      typeof message.text === "string"
    ){

      addMessage(
        message.text,
        "user"
      );

    }

    if(
      message.role === "model" &&
      typeof message.text === "string"
    ){

      addMessage(
        message.text,
        "ai"
      );

    }

  });

  renderHistory();

  closeSidebar();

  input.value = "";

  resizeInput();
renderHistory();

if(savedChats.length > 0){

  const lastChat = savedChats[0];

  loadChat(lastChat.id);

}else{

  currentChatId =
    Date.now().toString();

}
  input.focus();

  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  },100);
}

/* =========================
   NEW CHAT
========================= */

function newChat(){

  currentChatId =
    Date.now().toString();

  chatHistory = [];

  chatInner.innerHTML = `
    <div class="welcome" id="welcome">

      <div class="ai-avatar">
        <img
          src="character.png"
          alt="NOVA AI">
      </div>

      <h1>
        New <span>conversation.</span>
      </h1>

      <p>
        What would you like to explore today?
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="useSuggestion('Help me learn something new')">
          ✨ Learn something
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Give me a creative project idea')">
          💡 Creative idea
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Help me write some code')">
          💻 Help with code
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Explain AI in simple words')">
          🤖 Explain AI
        </button>

      </div>

    </div>
  `;

  input.value = "";

  resizeInput();

  closeSidebar();

  renderHistory();

  input.focus();
}


/* =========================
   SIDEBAR
========================= */

function toggleSidebar(){

  if(sidebar.classList.contains("open")){

    closeSidebar();

  }else{

    openSidebar();

  }

}


function openSidebar(){

  sidebar.classList.add("open");

  sidebarOverlay.style.display = "block";

}


function closeSidebar(){

  sidebar.classList.remove("open");

  sidebarOverlay.style.display = "none";

}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  chatHistory = [];

  chatInner.innerHTML = `

    <div class="welcome" id="welcome">

      <div class="ai-avatar">

        <img
          src="character.png"
          alt="NOVA AI">

      </div>

      <h1>
        New <span>conversation.</span>
      </h1>

      <p>
        What would you like to explore today?
      </p>

      <div class="suggestions">

        <button
          class="suggestion"
          onclick="useSuggestion('Help me learn something new')">
          ✨ Learn something
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Give me a creative project idea')">
          💡 Creative idea
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Help me write some code')">
          💻 Help with code
        </button>

        <button
          class="suggestion"
          onclick="useSuggestion('Explain AI in simple words')">
          🤖 Explain AI
        </button>

      </div>

    </div>

  `;

  input.value = "";

  resizeInput();

  closeSidebar();

  input.focus();

}


/* =========================
   SUGGESTION
========================= */

function useSuggestion(text){

  if(waitingForAI){
    return;
  }

  input.value = text;

  resizeInput();

  sendMessage();

}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
    input.value.trim();

  if(!text || waitingForAI){
    return;
  }


  const welcome =
    document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }


  addMessage(text,"user");

  input.value = "";

  resizeInput();

  waitingForAI = true;

  sendButton.disabled = true;

  showTyping();


 try{

    const response =
      await fetch("/api/chat",{

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          message:text,

          history:chatHistory

        })

      });


    let data = {};


    try{

      data = await response.json();

    }catch(e){

      data = {};

    }


    removeTyping();


    if(!response.ok){

      throw new Error(
        data.message ||
        data.error ||
        `HTTP Error ${response.status}`
      );

      }


    const reply =
      data.reply ||
      "माफ़ कीजिए, मुझे कोई जवाब नहीं मिला।";


    chatHistory.push({

      role:"user",
      text:text

    });


    chatHistory.push({

      role:"model",
      text:String(reply)

    });


    if(chatHistory.length > 20){

      chatHistory =
        chatHistory.slice(-20);

    }


    addMessage(
      String(reply),
      "ai"
    );
saveCurrentChat();

  }catch(error){

    removeTyping();

    console.error(
      "NOVA AI ERROR:",
      error
    );


    addMessage(

      "⚠️ NOVA AI से जवाब नहीं मिला।\n\n" +
      (
        error.message ||
        "Unknown error"
      ),

      "ai"

    );

  }


  waitingForAI = false;

  sendButton.disabled = false;

  input.focus();

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;


  if(type === "ai"){

    message.innerHTML = `

      <div class="msg-avatar">

        <img
          src="character.png"
          alt="NOVA">

          </div>

        <div class="msg-content">

     <div class="msg-name">
          NOVA AI
        </div>

        <div class="msg-text">
          ${escapeHTML(text)}
        </div>

      </div>

    `;

  }else{

    message.innerHTML = `

      <div class="msg-content">

        <div class="msg-name">
          You
        </div>

        <div class="msg-text">
          ${escapeHTML(text)}
        </div>

      </div>

    `;

  }


  chatInner.appendChild(message);

  scrollBottom();

}


/* =========================
   TYPING
========================= */

function showTyping(){

  removeTyping();


  const typing =
    document.createElement("div");

  typing.className =
    "message";

  typing.id =
    "typingMessage";


  typing.innerHTML = `

  <div class="msg-avatar">

      <img
        src="character.png"
        alt="NOVA">

       </div>

    <div class="msg-content">

      <div class="msg-name">
        NOVA AI
      </div>

      <div class="typing">

        <span></span>
        <span></span>
        <span></span>

      </div>

      </div>

  `;


  chatInner.appendChild(typing);

  scrollBottom();

}


function removeTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing){
    typing.remove();
  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(function(){

    chat.scrollTop =
      chat.scrollHeight;

  },50);

}


/* =========================
   TEXTAREA
========================= */

function resizeInput(){

  input.style.height = "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      120
    ) + "px";

}


/* =========================
   ENTER
========================= */

  function handleKey(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

}


/* =========================
   PROFILE
========================= */

function openProfile(){

  closeSidebar();

  window.location.href =
    "profile.html";

}


/* =========================
   SETTINGS
========================= */

function openSettings(){

  closeSidebar();

  window.location.href =
    "settings.html";

}


/* =========================
   LOGOUT
========================= */

function logout(){

  const ok =
    confirm(
      "Log out of NOVA AI?"
    );


  if(!ok){
    return;
  }


  localStorage.removeItem(
    "novaLoggedIn"
  );


  window.location.href =
    "login.html";

}

   ESC TO CLOSE SIDEBAR
========================= */

document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeSidebar();

    }

  }
);


/* =========================
   START
========================= */

resizeInput();
