<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA AI — Login</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#05050b;
  --line:rgba(255,255,255,.09);
  --text:#fff;
  --muted:#858596;
  --purple:#8b5cf6;
  --pink:#ec4899;
}

body{
  min-height:100vh;
  padding:20px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);

  background:
    radial-gradient(circle at 15% 20%,#8b5cf625,transparent 30%),
    radial-gradient(circle at 85% 75%,#ec489920,transparent 28%),
    var(--bg);
}

/* BACKGROUND */

.background{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.grid{
  position:absolute;
  inset:0;
  opacity:.12;

  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);

  background-size:60px 60px;

  mask-image:
    linear-gradient(to bottom,#000,transparent);
}

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(100px);
  opacity:.28;
}

.glow.one{
  width:250px;
  height:250px;
  left:-80px;
  top:-80px;
  background:#8b5cf6;
}

.glow.two{
  width:280px;
  height:280px;
  right:-100px;
  bottom:-120px;
  background:#ec4899;
}

/* MAIN */

.wrapper{
  width:min(1050px,100%);
  min-height:650px;

  display:grid;
  grid-template-columns:1.05fr .95fr;

  overflow:hidden;

  border:1px solid var(--line);
  border-radius:32px;

  background:#090912e8;

  backdrop-filter:blur(30px);

  box-shadow:0 35px 120px #000b;

  animation:appear .6s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

/* LEFT */

.left{
  position:relative;

  min-height:650px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:35px;

  border-right:1px solid var(--line);

  background:
    radial-gradient(
      circle at center,
      #8b5cf615,
      transparent 58%
    );
}

.brand{
  position:absolute;
  top:28px;
  left:30px;

  font-size:18px;
  font-weight:900;
  letter-spacing:1px;
}

.brand span{
  color:#a78bfa;
}

/* CHARACTER */

.character-area{
  width:min(430px,100%);
  height:430px;

  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;
}

.character-glow{
  position:absolute;

  width:330px;
  height:330px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #8b5cf650,
      transparent 68%
    );

  filter:blur(10px);
}

/* STATIC CHARACTER */

.character{
  position:relative;
  z-index:2;

  width:100%;
  height:100%;

  object-fit:contain;

  filter:
    drop-shadow(0 0 25px #8b5cf655)
    drop-shadow(0 25px 30px #000);
}

.left-text{
  text-align:center;
}

.left-text h2{
  font-size:27px;
  margin-bottom:8px;
}

.left-text h2 span{
  background:
    linear-gradient(
      90deg,
      #a78bfa,
      #f472b6
    );

  -webkit-background-clip:text;
  color:transparent;
}

.left-text p{
  color:var(--muted);
  font-size:12px;
}

/* RIGHT */

.right{
  padding:45px;

  display:flex;
  flex-direction:column;
  justify-content:center;
}

.small-title{
  margin-bottom:10px;

  color:#8b5cf6;

  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
}

.right h1{
  font-size:34px;
  line-height:1.1;
}

.description{
  margin-top:9px;
  margin-bottom:28px;

  color:var(--muted);

  font-size:12px;
  line-height:1.6;
}

/* FORM */

.field{
  margin-bottom:17px;
}

.field label{
  display:block;

  margin-bottom:7px;

  color:#b5b5c5;

  font-size:10px;
  font-weight:bold;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;

  left:15px;
  top:50%;

  transform:translateY(-50%);

  color:#77778a;

  font-size:14px;

  pointer-events:none;
}

.input-wrap input{
  width:100%;
  height:52px;

  padding:0 15px 0 43px;

  border:1px solid var(--line);
  border-radius:14px;

  outline:none;

  background:#ffffff04;

  color:#fff;

  font-size:12px;

  transition:.25s;
}

.input-wrap input::placeholder{
  color:#5e5e70;
}

.input-wrap input:focus{
  border-color:#8b5cf6;

  background:#8b5cf60a;

  box-shadow:
    0 0 0 3px #8b5cf615,
    0 0 25px #8b5cf615;
}

/* PASSWORD */

.password-button{
  position:absolute;

  right:12px;
  top:50%;

  transform:translateY(-50%);

  border:0;
  background:none;

  color:#9f8bd9;

  font-size:10px;

  cursor:pointer;
}

/* OPTIONS */

.options{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin:0 0 20px;

  font-size:9px;
}

.remember{
  display:flex;
  align-items:center;
  gap:7px;

  color:#777788;

  cursor:pointer;
}

.remember input{
  width:13px;
  height:13px;
  accent-color:#8b5cf6;
}

.forgot{
  color:#a78bfa;
  text-decoration:none;
}

.forgot:hover{
  color:#d8ccff;
}

/* BUTTON */

.login-btn{
  width:100%;
  height:53px;

  border:0;
  border-radius:15px;

  background:
    linear-gradient(
      100deg,
      #7c3aed,
      #8b5cf6,
      #ec4899
    );

  color:#fff;

  font-size:13px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:
    0 12px 35px #8b5cf640;

  transition:.25s;
}

.login-btn:hover{
  transform:translateY(-2px);

  box-shadow:
    0 17px 40px #8b5cf655;
}

.login-btn:active{
  transform:scale(.98);
}

/* MESSAGE */

.message{
  min-height:18px;

  margin-bottom:8px;

  text-align:center;

  font-size:10px;
}

.error{
  color:#fb7185;
}

.success{
  color:#4ade80;
}

/* SIGNUP */

.signup{
  margin-top:20px;

  text-align:center;

  color:#777788;

  font-size:11px;
}

.signup a{
  color:#a78bfa;

  text-decoration:none;

  font-weight:bold;
}

.signup a:hover{
  color:#d8ccff;
}

/* HOME */

.home{
  display:block;

  margin-top:18px;

  text-align:center;

  color:#555568;

  font-size:10px;

  text-decoration:none;
}

.home:hover{
  color:#9999aa;
}

/* MOBILE */

@media(max-width:760px){

  body{
    padding:15px;
  }

  .wrapper{
    width:100%;
    margin:10px auto 25px;

    grid-template-columns:1fr;

    border-radius:25px;
  }

  .left{
    min-height:350px;

    padding:25px;

    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .brand{
    position:static;

    align-self:flex-start;

    margin-bottom:5px;
  }

  .character-area{
    width:290px;
    height:250px;
  }

  .character-glow{
    width:210px;
    height:210px;
  }

  .left-text h2{
    font-size:22px;
  }

  .right{
    padding:30px 22px 35px;
  }

  .right h1{
    font-size:28px;
  }
}

@media(max-width:380px){

  .left{
    min-height:320px;
  }

  .character-area{
    width:240px;
    height:220px;
  }

  .right{
    padding:25px 17px 30px;
  }
}
</style>
</head>

<body>

<div class="background">
  <div class="grid"></div>
  <div class="glow one"></div>
  <div class="glow two"></div>
</div>


<div class="wrapper">

  <!-- LEFT -->

  <section class="left">

    <div class="brand">
      NOVA <span>AI</span>
    </div>


    <div class="character-area">

      <div class="character-glow"></div>

      <img
        src="character.png"
        class="character"
        alt="NOVA AI Character">

    </div>


    <div class="left-text">

      <h2>
        Welcome
        <span>back.</span>
      </h2>

      <p>
        Your AI workspace is waiting for you.
      </p>

    </div>

  </section>


  <!-- RIGHT -->

  <section class="right">

    <div class="small-title">
      WELCOME BACK
    </div>


    <h1>
      Log in
    </h1>


    <p class="description">
      Continue your journey with NOVA AI.
    </p>


    <div
      id="message"
      class="message">
    </div>


    <!-- EMAIL -->

    <div class="field">

      <label>
        EMAIL ADDRESS
      </label>

      <div class="input-wrap">

        <span class="input-icon">
          @
        </span>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email">

      </div>

    </div>


    <!-- PASSWORD -->

    <div class="field">

      <label>
        PASSWORD
      </label>

      <div class="input-wrap">

        <span class="input-icon">
          ◆
        </span>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password">

        <button
          class="password-button"
          type="button"
          onclick="togglePassword()">

          Show

        </button>

      </div>

    </div>


    <!-- OPTIONS -->

    <div class="options">

      <label class="remember">

        <input
          id="remember"
          type="checkbox">

        Remember me

      </label>


      <a
        href="#"
        class="forgot"
        onclick="forgotPassword(event)">

        Forgot password?

      </a>

    </div>


    <!-- LOGIN -->

    <button
      class="login-btn"
      onclick="login()">

      Enter NOVA AI
      <span> →</span>

    </button>


    <!-- SIGNUP -->

    <div class="signup">

      Don't have an account?

      <a href="signup.html">
        Create one
      </a>

    </div>


    <!-- HOME -->

    <a
      href="index.html"
      class="home">

      ← Back to home

    </a>

  </section>

</div>


<script>

/* =========================
   PASSWORD
========================= */

function togglePassword(){

  const input =
    document.getElementById(
      "password"
    );

  const button =
    document.querySelector(
      ".password-button"
    );


  if(
    input.type === "password"
  ){

    input.type = "text";
    button.textContent = "Hide";

  }else{

    input.type = "password";
    button.textContent = "Show";

  }

}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const box =
    document.getElementById(
      "message"
    );

  box.textContent = text;

  box.className =
    "message " + type;

}


/* =========================
   LOGIN
========================= */

function login(){

  const email =
    document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();


  const password =
    document
      .getElementById("password")
      .value;


  const savedEmail =
    localStorage.getItem(
      "novaEmail"
    );


  const savedPassword =
    localStorage.getItem(
      "novaDemoPassword"
    );


  /* NO ACCOUNT */

  if(!savedEmail){

    showMessage(
      "No account found. Please sign up first.",
      "error"
    );

    return;
  }


  /* EMPTY */

  if(!email || !password){

    showMessage(
      "Please enter your email and password.",
      "error"
    );

    return;
  }


  /* CHECK */

  if(
    email !== savedEmail ||
    password !== savedPassword
  ){

    showMessage(
      "Incorrect email or password.",
      "error"
    );

    return;
  }


  /* LOGIN SUCCESS */

  localStorage.setItem(
    "novaLoggedIn",
    "true"
  );


  showMessage(
    "Login successful ✨",
    "success"
  );


  setTimeout(
    function(){

      window.location.href =
        "chat.html";

    },
    800
  );

}


/* =========================
   FORGOT PASSWORD
========================= */

function forgotPassword(event){

  event.preventDefault();

  const email =
    localStorage.getItem(
      "novaEmail"
    );


  if(!email){

    showMessage(
      "No account found. Please create an account first.",
      "error"
    );

    return;
  }


  showMessage(
    "Password recovery will be added with the real authentication system.",
    "error"
  );

}

</script>

</body>
</html>
